:root {
  --bg:#fafaf7; --bg2:#f0efea; --surface:#ffffff; --surface2:#fafaf6;
  --border:#e3e1da; --border-mid:#c4c2b9;
  --text:#0a2447; --text-mid:#2d4570; --text-dim:#6b7a90;
  --sky:#4a90d9; --sky-light:#bcd6ef;
  --navy:#1a4480; --navy-dark:#0a2447; --navy-light:#e8eef7;
  --gold:#c9a961; --gold-dark:#a8893f; --gold-light:#f7efd9;
  --green:#1a6b3c; --green-bg:#f0f7f3;
  --warn:#a8893f; --warn-bg:#f7efd9;
  --gradient-blue: linear-gradient(135deg, #4a90d9 0%, #1a4480 50%, #0a2447 100%);

  --s1:#9ca3af; /* New Lead - gray */
  --s2:#60a5fa; /* Initial Contact - light blue */
  --s3:#3b82f6; /* Follow-up/Sampling - blue */
  --s4:#10b981; /* First Order - emerald */
  --s5:#8b5cf6; /* Team Tasting - purple */
  --s6:#f59e0b; /* Activation Scheduled - amber */
  --s7:#c9a961; /* Menu Placement - gold */
  --s8:#1a6b3c; /* Continued Support - deep green */
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); font-family:"Inter",sans-serif; -webkit-font-smoothing:antialiased; color:var(--text); }
.app { max-width:1100px; margin:0 auto; padding:0 0 80px; background:var(--bg); min-height:100vh; }
.header { background:var(--gradient-blue); color:#fff; padding:18px 24px 14px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100; }
.brand { display:flex; align-items:center; gap:10px; }
.brand-wordmark { font-family:"Cormorant Garamond",serif; font-size:22px; font-weight:700; letter-spacing:0.12em; color:#fff; }
.brand-sub { font-size:9px; letter-spacing:0.18em; color:var(--gold); margin-top:2px; text-transform:uppercase; font-style:italic; }
.tab-row { display:flex; gap:0; border-bottom:1px solid var(--border); background:var(--surface); padding:0 16px; overflow-x:auto; position:sticky; top:64px; z-index:99; }
.tab { background:none; border:none; border-bottom:2px solid transparent; padding:12px 14px; font-family:"DM Mono",monospace; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-dim); cursor:pointer; white-space:nowrap; }
.tab.active { color:var(--navy); border-bottom-color:var(--navy); }
.tab-badge { background:var(--bg2); color:var(--text-mid); font-size:9px; padding:1px 6px; margin-left:4px; }
.tab.active .tab-badge { background:var(--navy); color:#fff; }
.content { padding:20px; }
.controls { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
.search-input { flex:1; min-width:180px; padding:9px 12px; border:1px solid var(--border); background:var(--surface); font-family:"DM Mono",monospace; font-size:11px; outline:none; }
.filter-btn { padding:6px 12px; border:1px solid var(--border); background:var(--surface); font-family:"DM Mono",monospace; font-size:9px; letter-spacing:0.1em; color:var(--text-dim); cursor:pointer; text-transform:uppercase; }
.filter-btn.active { background:var(--navy); color:#fff; border-color:var(--navy); }
.stage-strip { display:flex; gap:6px; margin-bottom:18px; overflow-x:auto; padding-bottom:8px; }
.stage-chip { flex-shrink:0; padding:9px 14px; border-radius:20px; background:var(--surface); border:1.5px solid var(--border); font-family:"DM Mono",monospace; font-size:10px; letter-spacing:0.08em; cursor:pointer; color:var(--text-dim); text-transform:uppercase; }
.stage-chip.active { background:var(--navy); color:#fff; border-color:var(--navy); }
.stage-chip-count { background:rgba(0,0,0,0.08); color:inherit; padding:1px 6px; margin-left:6px; border-radius:10px; font-size:9px; }
.stage-chip.active .stage-chip-count { background:rgba(255,255,255,0.25); color:#fff; }
.count-label { font-size:9px; letter-spacing:0.14em; color:var(--text-dim); text-transform:uppercase; margin-bottom:10px; }
.card { background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--s1); padding:14px 18px; margin-bottom:6px; cursor:pointer; display:flex; gap:14px; align-items:center; }
.card.s1 { border-left-color:var(--s1); }
.card.s2 { border-left-color:var(--s2); }
.card.s3 { border-left-color:var(--s3); }
.card.s4 { border-left-color:var(--s4); }
.card.s5 { border-left-color:var(--s5); }
.card.s6 { border-left-color:var(--s6); }
.card.s7 { border-left-color:var(--s7); }
.card.s8 { border-left-color:var(--s8); }
.card-body { flex:1; min-width:0; }
.card-name { font-family:"Cormorant Garamond",serif; font-size:17px; font-weight:600; color:var(--text); }
.card-meta { font-size:10px; color:var(--text-dim); margin-top:3px; }
.card-right { text-align:right; flex-shrink:0; }
.stage-badge { font-family:"DM Mono",monospace; font-size:9px; letter-spacing:0.08em; padding:3px 8px; border-radius:10px; color:#fff; text-transform:uppercase; }
.stage-badge.s1 { background:var(--s1); }
.stage-badge.s2 { background:var(--s2); }
.stage-badge.s3 { background:var(--s3); }
.stage-badge.s4 { background:var(--s4); }
.stage-badge.s5 { background:var(--s5); }
.stage-badge.s6 { background:var(--s6); }
.stage-badge.s7 { background:var(--s7); }
.stage-badge.s8 { background:var(--s8); }
.card-cases { font-size:10px; color:var(--text-dim); margin-top:4px; }
.form-wrap { padding:0 20px 20px; }
.form-title { font-family:"Cormorant Garamond",serif; font-size:22px; font-weight:700; color:var(--navy); padding:16px 20px 12px; }
.fr { display:flex; gap:14px; margin-bottom:14px; flex-wrap:wrap; }
.fr > div { flex:1 1 200px; }
.fr1 > div { width:100%; }
.fl { display:block; font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-dim); margin-bottom:5px; }
.fi { width:100%; padding:9px 10px; border:1px solid var(--border); background:var(--surface); font-family:"DM Mono",monospace; font-size:11px; outline:none; }
.fs { width:100%; padding:9px 10px; border:1px solid var(--border); background:var(--surface); font-family:"DM Mono",monospace; font-size:11px; outline:none; }
.fta { width:100%; padding:9px 10px; border:1px solid var(--border); background:var(--surface); font-family:"DM Mono",monospace; font-size:11px; outline:none; min-height:80px; resize:vertical; }
.action-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; }
.btn-primary { padding:10px 20px; background:var(--navy); color:#fff; border:none; font-family:"DM Mono",monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; }
.btn-secondary { padding:10px 20px; background:none; color:var(--text-mid); border:1px solid var(--border); font-family:"DM Mono",monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; }
.btn-del { padding:10px 20px; background:none; color:#c0392b; border:1px solid rgba(192,57,43,0.3); font-family:"DM Mono",monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; }
.btn-ghost { background:none; border:none; font-family:"DM Mono",monospace; font-size:10px; letter-spacing:0.1em; color:var(--text-dim); cursor:pointer; padding:16px 20px 0; text-transform:uppercase; }
.save-toast { position:fixed; bottom:24px; right:20px; background:var(--navy); color:#fff; font-family:"DM Mono",monospace; font-size:10px; letter-spacing:0.1em; padding:8px 16px; opacity:0; transition:opacity 0.3s; pointer-events:none; z-index:9999; }
.save-toast.show { opacity:1; }
.sync-dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; }
.sync-dot.on { background:#4ade80; }
.sync-dot.off { background:#9ca3af; }
.stage-progression { display:flex; gap:2px; margin:14px 0; }
.stage-prog-step { flex:1; height:6px; background:var(--bg2); border-radius:3px; position:relative; }
.stage-prog-step.done { background:var(--s8); }
.stage-prog-step.current { background:var(--navy); }
.activity-log { margin-top:18px; }
.activity-item { background:var(--surface2); border:1px solid var(--border); border-left:3px solid var(--navy); padding:10px 14px; margin-bottom:5px; }
.activity-item-head { display:flex; justify-content:space-between; margin-bottom:4px; align-items:center; }
.activity-type { font-size:9px; letter-spacing:0.1em; text-transform:uppercase; font-weight:600; }
.activity-date { font-size:10px; color:var(--text-dim); }
.activity-note { font-size:11px; line-height:1.5; }
.add-activity { background:var(--navy-light); border:1px solid var(--border); padding:14px; margin-bottom:14px; }
.activity-type-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.activity-type-btn { padding:6px 12px; background:var(--surface); border:1px solid var(--border); font-family:"DM Mono",monospace; font-size:9px; letter-spacing:0.08em; cursor:pointer; text-transform:uppercase; color:var(--text-dim); }
.activity-type-btn.active { background:var(--navy); color:#fff; border-color:var(--navy); }
</style>
</head>

// Migrate: all accounts get stage s8 (Continued Support), all leads get s1 (New Lead)
const MIGRATED_RECORDS = [
  ...ACCOUNTS_INIT.map(a => ({
    ...a,
    recordType: "account",
    stage: "s8",
    casesPerMonth: 0,
    stageEntered: a.createdAt || today(),
  })),
  ...LEADS_INIT.map(l => ({
    ...l,
    recordType: "lead",
    stage: "s1",
    casesPerMonth: 0,
    stageEntered: l.createdAt || today(),
  }))
];

const emptyRecord = {
  id:null, name:"", type:"Bar", recordType:"lead", stage:"s1",
  city:"", address:"", contact:"", phone:"", email:"",
  casesPerMonth: 0, products:"", source:"", notes:"",
  stageEntered: today(), createdAt: today(), activityLog: []
};

function DiosAzulCRM() {
  const [records, setRecords] = useState(() => { 
    try { 
      const s = localStorage.getItem("da_records"); 
      return s ? JSON.parse(s) : MIGRATED_RECORDS; 
    } catch { return MIGRATED_RECORDS; } 
  });
  const [tab, setTab] = useState("pipeline");
  const [view, setView] = useState("list");
  const [search, setSearch] = useState("");
  const [stageFilter, setStageFilter] = useState("all");
  const [typeFilter, setTypeFilter] = useState("All");
  const [form, setForm] = useState(emptyRecord);
  const [activityType, setActivityType] = useState("Visit");
  const [activityNote, setActivityNote] = useState("");
  const [activityDate, setActivityDate] = useState(today());
  const [followupDate, setFollowupDate] = useState("");
  const [saveToast, setSaveToast] = useState(false);
  const [syncUrl, setSyncUrl] = useState(() => { try { return localStorage.getItem("da_sync_url") || ""; } catch { return ""; } });
  const [syncStatus, setSyncStatus] = useState("");
  const [autoSync, setAutoSync] = useState(() => { try { return localStorage.getItem("da_auto_sync") === "1"; } catch { return false; } });
  const [showSettings, setShowSettings] = useState(false);
  const [monthlyGoal, setMonthlyGoal] = useState(() => { try { return parseInt(localStorage.getItem("da_monthly_goal"))||75; } catch { return 75; } });
  const saveMonthlyGoal = (n) => { setMonthlyGoal(n); try { localStorage.setItem("da_monthly_goal", String(n)); } catch {} };
  const toastTimer = useRef(null);
  const pushTimer = useRef(null);
  const dirtyRef = useRef(false);
  const firstRenderRef = useRef(true);

  useEffect(() => { try { localStorage.setItem("da_records", JSON.stringify(records)); } catch {} }, [records]);

  // ── Cloud sync ──
  const saveSyncUrl = (url) => { setSyncUrl(url); try { localStorage.setItem("da_sync_url", url); } catch {} };
  const cloudPush = async (silent) => {
    if (!syncUrl) { if (!silent) setSyncStatus("Set sync URL in Settings first"); return; }
    if (!silent) setSyncStatus("Pushing to cloud...");
    try {
      await fetch(syncUrl, { method:"POST", body: JSON.stringify({ records }), headers:{"Content-Type":"text/plain;charset=utf-8"} });
      dirtyRef.current = false;
      if (!silent) { setSyncStatus("Pushed at " + new Date().toLocaleTimeString()); setTimeout(()=>setSyncStatus(""), 3000); }
    } catch (err) { if (!silent) setSyncStatus("Push failed: " + err.message); throw err; }
  };
  const cloudPull = async (force) => {
    if (!syncUrl) { setSyncStatus("Set sync URL in Settings first"); return; }
    if (dirtyRef.current && !force) {
      setSyncStatus("Skipped pull — pushing local changes first");
      try { await cloudPush(true); } catch (e) {}
      setTimeout(() => setSyncStatus(""), 2000); return;
    }
    setSyncStatus("Pulling from cloud...");
    try {
      const res = await fetch(syncUrl + "?type=all&_=" + Date.now());
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      
      let newRecords = null;
      // Prefer records tab if it exists and has data
      if (Array.isArray(data.records) && data.records.length > 0) {
        newRecords = data.records;
      } 
      // Otherwise migrate from accounts + leads on the fly
      else if ((Array.isArray(data.accounts) && data.accounts.length > 0) || (Array.isArray(data.leads) && data.leads.length > 0)) {
        const migrated = [];
        (data.accounts || []).forEach(a => {
          migrated.push({...a, recordType:"account", stage:"s8", casesPerMonth:Number(a.casesPerMonth)||0, stageEntered:a.createdAt||today(), activityLog:Array.isArray(a.activityLog)?a.activityLog:[]});
        });
        (data.leads || []).forEach(l => {
          migrated.push({...l, recordType:"lead", stage:"s1", casesPerMonth:Number(l.casesPerMonth)||0, stageEntered:l.createdAt||today(), activityLog:Array.isArray(l.activityLog)?l.activityLog:[]});
        });
        newRecords = migrated;
      }
      
      if (newRecords) {
        setRecords(newRecords);
        try { localStorage.setItem("da_records", JSON.stringify(newRecords)); } catch {}
        setSyncStatus("Pulled " + newRecords.length + " records at " + new Date().toLocaleTimeString());
      } else {
        setSyncStatus("Pulled (no data to update) at " + new Date().toLocaleTimeString());
      }
      setTimeout(()=>setSyncStatus(""), 3000);
    } catch (err) { setSyncStatus("Pull failed: " + err.message); }
  };
  useEffect(() => {
    if (firstRenderRef.current) { firstRenderRef.current = false; return; }
    dirtyRef.current = true;
    if (!autoSync || !syncUrl) return;
    if (pushTimer.current) clearTimeout(pushTimer.current);
    pushTimer.current = setTimeout(() => { cloudPush(true).then(()=>{ dirtyRef.current = false; }).catch(()=>{}); }, 300);
    return () => { if (pushTimer.current) clearTimeout(pushTimer.current); };
  }, [records, autoSync, syncUrl]);
  useEffect(() => { if (syncUrl && !dirtyRef.current) cloudPull(); /* eslint-disable-next-line */ }, []);
  const toggleAutoSync = () => { const n = !autoSync; setAutoSync(n); try { localStorage.setItem("da_auto_sync", n?"1":"0"); } catch {} };

  // ── Helpers ──
  const fmt = n => "$" + (Number(n)||0).toLocaleString(undefined, {minimumFractionDigits:0, maximumFractionDigits:0});
  const persist = (data) => {
    setRecords(data);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    setSaveToast(true);
    toastTimer.current = setTimeout(() => setSaveToast(false), 1500);
  };
  const stageIdx = sid => STAGES.findIndex(s => s.id === sid);
  const stageName = sid => { const s = STAGES.find(x=>x.id===sid); return s ? s.name : "Unknown"; };

  // ── Filtering ──
  const types = ["All","Bar","Restaurant","Hotel","Retail","Total Wine"];
  const matchType = item => typeFilter==="All" ? true : typeFilter==="Total Wine" ? (item.name||"").toLowerCase().includes("total wine") : item.type===typeFilter;
  const filtered = useMemo(() => records.filter(r => {
    if (stageFilter !== "all" && r.stage !== stageFilter) return false;
    if (!matchType(r)) return false;
    if (search) {
      const q = search.toLowerCase();
      if (!(r.name||"").toLowerCase().includes(q) && !(r.city||"").toLowerCase().includes(q) && !(r.contact||"").toLowerCase().includes(q)) return false;
    }
    return true;
  }), [records, stageFilter, typeFilter, search]);

  // Counts by stage
  const stageCounts = useMemo(() => {
    const c = {};
    STAGES.forEach(s => c[s.id] = 0);
    records.forEach(r => { if (c[r.stage]!==undefined) c[r.stage]++; });
    return c;
  }, [records]);

  // ── Detail / Edit view ──
  if (view==="add" || view==="edit") {
    const F = k => ({value: form[k]||"", onChange: e=>setForm(p=>({...p,[k]:e.target.value}))});
    const save = () => {
      const u = view==="add"
        ? [...records, {...form, id:Date.now(), createdAt:today(), stageEntered:today(), activityLog: form.activityLog||[]}]
        : records.map(r => r.id===form.id ? form : r);
      persist(u); setView("list");
    };
    const del = () => { 
      if (!window.confirm("Delete this record?")) return;
      persist(records.filter(r => r.id !== form.id)); setView("list"); 
    };
    const moveStage = (newStage) => {
      const u = {...form, stage: newStage, stageEntered: today()};
      // also log it as an activity
      const log = Array.isArray(u.activityLog) ? u.activityLog : [];
      u.activityLog = [{date:today(), type:"Stage change", note:`Moved to: ${stageName(newStage)}`}, ...log];
      setForm(u);
      persist(records.map(r => r.id===u.id ? u : r));
    };
    const addActivity = () => {
      if (!activityNote.trim()) return;
      const log = Array.isArray(form.activityLog) ? form.activityLog : [];
      const entry = {
        date: activityDate || today(),
        type: activityType,
        note: activityNote.trim()
      };
      if (followupDate) entry.followupDate = followupDate;
      const updated = {...form, activityLog: [entry, ...log]};
      // If a follow-up date was set, also update the record's nextFollowUp field
      if (followupDate) updated.nextFollowUp = followupDate;
      setForm(updated);
      if (view==="edit") persist(records.map(r => r.id===updated.id ? updated : r));
      setActivityNote("");
      setActivityDate(today());
      setFollowupDate("");
    };

    const curStageIdx = stageIdx(form.stage);
    const estIncome = (Number(form.casesPerMonth)||0) * COMMISSION_PER_CASE;

    return (<div className="app">
      <div className="header"><div className="brand">
        <svg width="22" height="28" viewBox="0 0 22 28" fill="none">
          <path d="M11 0 C11 0, 8 4, 8 9 C8 11, 9 12, 9 12 L11 14 L13 12 C13 12, 14 11, 14 9 C14 4, 11 0, 11 0Z" fill="#bcd6ef"/>
          <path d="M11 4 C11 4, 6 8, 5 14 C5 18, 7 20, 7 20 L11 24 L15 20 C15 20, 17 18, 17 14 C16 8, 11 4, 11 4Z" fill="#4a90d9"/>
          <path d="M11 10 C11 10, 4 14, 3 22 C3 25, 5 27, 5 27 L11 28 L17 27 C17 27, 19 25, 19 22 C18 14, 11 10, 11 10Z" fill="#1a4480" opacity="0.85"/>
        </svg>
        <div><p className="brand-wordmark">DIOS AZUL</p><p className="brand-sub">CRM</p></div>
      </div></div>
      <button className="btn-ghost" onClick={()=>setView("list")}>&larr; Back</button>
      <p className="form-title">{view==="add"?"New Record":form.name||"Edit"}</p>
      
      <div className="form-wrap">
        {/* Stage progression */}
        <label className="fl">Stage</label>
        <div className="stage-progression">
          {STAGES.map((s, i) => (
            <div key={s.id} className={"stage-prog-step "+(i<curStageIdx?"done":i===curStageIdx?"current":"")} title={s.name}/>
          ))}
        </div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:18}}>
          {STAGES.map(s => (
            <button key={s.id} className={"stage-chip"+(form.stage===s.id?" active":"")} 
              style={form.stage===s.id?{background:s.color,borderColor:s.color}:{}} onClick={()=>moveStage(s.id)}>
              {s.name}
            </button>
          ))}
        </div>

        <div className="fr">
          <div><label className="fl">Name</label><input className="fi" {...F("name")}/></div>
          <div><label className="fl">Type</label><select className="fs" {...F("type")}>{["Bar","Restaurant","Hotel","Retail"].map(t=><option key={t}>{t}</option>)}</select></div>
        </div>
        <div className="fr">
          <div><label className="fl">City</label><input className="fi" {...F("city")}/></div>
          <div><label className="fl">Phone</label><input className="fi" {...F("phone")}/></div>
        </div>
        <div className="fr1"><div><label className="fl">Address</label><input className="fi" {...F("address")}/></div></div>
        <div className="fr">
          <div><label className="fl">Contact</label><input className="fi" {...F("contact")}/></div>
          <div><label className="fl">Email</label><input className="fi" {...F("email")}/></div>
        </div>
        <div className="fr">
          <div><label className="fl">Cases / Month (estimate)</label><input className="fi" type="number" min="0" value={form.casesPerMonth||0} onChange={e=>setForm(p=>({...p,casesPerMonth:Number(e.target.value)}))}/></div>
          <div><label className="fl">Est. Monthly Income</label><input className="fi" value={fmt(estIncome)} readOnly style={{background:"var(--bg2)",color:"var(--gold-dark)",fontWeight:600}}/></div>
        </div>
        <div className="fr1"><div><label className="fl">Notes</label><textarea className="fta" {...F("notes")}/></div></div>
        
        {view==="edit" && <>
          <h3 style={{fontFamily:"Cormorant Garamond,serif",fontSize:18,marginTop:24,marginBottom:10,color:"var(--navy)"}}>Activity Log</h3>
          <div className="add-activity">
            <div className="fr" style={{marginBottom:10}}>
              <div style={{flex:"1 1 140px"}}>
                <label className="fl">Date</label>
                <input className="fi" type="date" value={activityDate} onChange={e=>setActivityDate(e.target.value)}/>
              </div>
              <div style={{flex:"1 1 180px"}}>
                <label className="fl">Type</label>
                <select className="fs" value={activityType} onChange={e=>setActivityType(e.target.value)}>
                  {ACTIVITY_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                </select>
              </div>
            </div>
            <div style={{marginBottom:10}}>
              <label className="fl">Note</label>
              <textarea className="fta" placeholder={`What happened? (e.g. dropped 2 samples, spoke with manager...)`} value={activityNote} onChange={e=>setActivityNote(e.target.value)} style={{minHeight:60}}/>
            </div>
            <div className="fr" style={{marginBottom:10}}>
              <div style={{flex:"1 1 140px"}}>
                <label className="fl">Follow-up Date (optional)</label>
                <input className="fi" type="date" value={followupDate} onChange={e=>setFollowupDate(e.target.value)}/>
              </div>
              <div style={{flex:"1 1 180px",display:"flex",alignItems:"flex-end"}}>
                <button className="btn-primary" onClick={addActivity} style={{width:"100%"}}>Log Activity</button>
              </div>
            </div>
          </div>
          <div className="activity-log">
            {(form.activityLog||[]).length===0 && <p style={{fontSize:11,color:"var(--text-dim)",fontStyle:"italic"}}>No activity logged yet.</p>}
            {(form.activityLog||[]).map((a,i) => (
              <div key={i} className="activity-item">
                <div className="activity-item-head">
                  <span className="activity-type" style={{color:"var(--navy)"}}>{a.type||"Activity"}</span>
                  <span className="activity-date">{a.date}</span>
                </div>
                <p className="activity-note">{a.note}</p>
                {a.followupDate && <p style={{fontSize:10,color:"var(--gold-dark)",marginTop:6,fontWeight:600}}>📅 Follow-up: {a.followupDate}</p>}
              </div>
            ))}
          </div>
        </>}
        
        <div className="action-row">
          <button className="btn-primary" onClick={save}>Save</button>
          {view==="edit" && <button className="btn-del" onClick={del}>Delete</button>}
          <button className="btn-secondary" onClick={()=>setView("list")}>Cancel</button>
        </div>
      </div>
    </div>);
  }

  // ── Pipeline list view ──
  return (<div className="app">
    <div className="header">
      <div className="brand">
        <svg width="22" height="28" viewBox="0 0 22 28" fill="none">
          <path d="M11 0 C11 0, 8 4, 8 9 C8 11, 9 12, 9 12 L11 14 L13 12 C13 12, 14 11, 14 9 C14 4, 11 0, 11 0Z" fill="#bcd6ef"/>
          <path d="M11 4 C11 4, 6 8, 5 14 C5 18, 7 20, 7 20 L11 24 L15 20 C15 20, 17 18, 17 14 C16 8, 11 4, 11 4Z" fill="#4a90d9"/>
          <path d="M11 10 C11 10, 4 14, 3 22 C3 25, 5 27, 5 27 L11 28 L17 27 C17 27, 19 25, 19 22 C18 14, 11 10, 11 10Z" fill="#1a4480" opacity="0.85"/>
        </svg>
        <div><p className="brand-wordmark">DIOS AZUL</p><p className="brand-sub">CRM Pro</p></div>
      </div>
      <button className="btn-primary" onClick={()=>{setForm({...emptyRecord,id:null});setView("add");}}>+ New</button>
    </div>

    <div className="tab-row">
      <button className={"tab"+(tab==="pipeline"?" active":"")} onClick={()=>setTab("pipeline")}>Pipeline <span className="tab-badge">{records.length}</span></button>
      <button className={"tab"+(tab==="dashboard"?" active":"")} onClick={()=>setTab("dashboard")}>Dashboard</button>
      <button className={"tab"+(tab==="reports"?" active":"")} onClick={()=>setTab("reports")}>Reports</button>
      <button className="tab" style={{marginLeft:"auto"}} onClick={()=>setShowSettings(true)}><span className={"sync-dot "+(autoSync&&syncUrl?"on":"off")}></span>Sync</button>
      <button className="tab" style={{color:"var(--gold-dark)"}} onClick={()=>cloudPush(false)}>&uarr;</button>
      <button className="tab" style={{color:"var(--gold-dark)"}} onClick={()=>cloudPull(true)}>&darr;</button>
    </div>

    <div className="content">
      {tab==="pipeline" && <>
        <div className="stage-strip">
          <button className={"stage-chip"+(stageFilter==="all"?" active":"")} onClick={()=>setStageFilter("all")}>All <span className="stage-chip-count">{records.length}</span></button>
          {STAGES.map(s => (
            <button key={s.id} className={"stage-chip"+(stageFilter===s.id?" active":"")} 
              style={stageFilter===s.id?{background:s.color,borderColor:s.color}:{}}
              onClick={()=>setStageFilter(s.id)}>
              {s.name} <span className="stage-chip-count">{stageCounts[s.id]}</span>
            </button>
          ))}
        </div>

        <div className="controls">
          <input className="search-input" placeholder="Search by name, city, contact..." value={search} onChange={e=>setSearch(e.target.value)}/>
          {types.map(t=><button key={t} className={"filter-btn"+(typeFilter===t?" active":"")} onClick={()=>setTypeFilter(t)}>{t}</button>)}
        </div>

        <div className="count-label">{filtered.length} RECORDS{stageFilter!=="all" && " · " + stageName(stageFilter).toUpperCase()}</div>
        {filtered.map(r => (
          <div key={r.id} className={"card "+r.stage} onClick={()=>{setForm(r);setView("edit");}}>
            <div className="card-body">
              <p className="card-name">{r.name}</p>
              <p className="card-meta">{[r.city, r.contact, r.phone].filter(Boolean).join(" · ")}</p>
              {r.casesPerMonth>0 && <p className="card-cases">📦 {r.casesPerMonth} cs/mo · ${(r.casesPerMonth*COMMISSION_PER_CASE).toLocaleString()}/mo</p>}
            </div>
            <div className="card-right">
              <span className={"stage-badge "+r.stage}>{stageName(r.stage)}</span>
              <p style={{fontSize:9,color:"var(--text-dim)",marginTop:6}}>{r.type}</p>
            </div>
          </div>
        ))}
        {filtered.length===0 && <p style={{textAlign:"center",padding:40,color:"var(--text-dim)"}}>No records match your filters.</p>}
      </>}

      {tab==="dashboard" && (() => {
        const now = new Date();
        const thisMonth = now.toISOString().slice(0,7);  // "2026-05"
        // Calculate pipeline metrics
        const totalCasesEstimate = records.reduce((s,r)=>s+(Number(r.casesPerMonth)||0),0);
        const totalPipelineValue = totalCasesEstimate * COMMISSION_PER_CASE;
        const activeAccounts = records.filter(r => ["s4","s5","s6","s7","s8"].includes(r.stage));
        const activeCasesEstimate = activeAccounts.reduce((s,r)=>s+(Number(r.casesPerMonth)||0),0);
        const activeIncome = activeCasesEstimate * COMMISSION_PER_CASE;
        
        // This month's activities
        const allActivities = [];
        records.forEach(r => {
          (r.activityLog||[]).forEach(a => allActivities.push({...a, recordName:r.name, recordId:r.id, recordStage:r.stage}));
        });
        const thisMonthActivities = allActivities.filter(a => (a.date||"").startsWith(thisMonth));
        const ordersThisMonth = thisMonthActivities.filter(a => a.type === "Order placed");
        
        // Follow-ups due (today or earlier)
        const todayStr = today();
        const followUpsDue = [];
        records.forEach(r => {
          if (r.nextFollowUp && r.nextFollowUp <= todayStr) {
            followUpsDue.push({name:r.name, id:r.id, date:r.nextFollowUp, stage:r.stage});
          }
          (r.activityLog||[]).forEach(a => {
            if (a.followupDate && a.followupDate <= todayStr) {
              const exists = followUpsDue.find(f => f.id === r.id);
              if (!exists) followUpsDue.push({name:r.name, id:r.id, date:a.followupDate, stage:r.stage, note:a.note});
            }
          });
        });
        followUpsDue.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
        
        // Recent activity feed
        const recentActivity = allActivities.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,8);
        
        // Top opportunities — accounts NOT in s8 with high cases/mo estimate
        const topOpps = records
          .filter(r => r.stage !== "s8" && (Number(r.casesPerMonth)||0) > 0)
          .sort((a,b)=>(Number(b.casesPerMonth)||0) - (Number(a.casesPerMonth)||0))
          .slice(0,5);
        
        // Goal progress
        const goalProgress = monthlyGoal > 0 ? Math.min(100, (activeCasesEstimate / monthlyGoal) * 100) : 0;
        const isOnTrack = activeCasesEstimate >= monthlyGoal;
        
        // Stages with counts and values
        const stageData = STAGES.map(s => {
          const inStage = records.filter(r => r.stage === s.id);
          const cases = inStage.reduce((sum,r) => sum + (Number(r.casesPerMonth)||0), 0);
          return {...s, count:inStage.length, cases, value: cases * COMMISSION_PER_CASE};
        });
        const maxStageCount = Math.max(...stageData.map(s => s.count), 1);
        
        return (<>
          {/* Goal Tracker */}
          <div style={{background:"var(--surface)",border:"1px solid var(--border)",padding:"20px 24px",marginBottom:20}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14,flexWrap:"wrap",gap:10}}>
              <div>
                <p style={{fontSize:9,letterSpacing:"0.12em",color:"var(--text-dim)",textTransform:"uppercase",marginBottom:4}}>Monthly Case Pipeline Goal</p>
                <p style={{fontFamily:"Cormorant Garamond,serif",fontSize:28,fontWeight:700,color:isOnTrack?"var(--green)":"var(--navy)"}}>
                  {activeCasesEstimate} <span style={{fontSize:18,color:"var(--text-dim)"}}>/ {monthlyGoal} cases</span>
                </p>
                <p style={{fontSize:11,color:"var(--text-dim)",marginTop:2}}>
                  {isOnTrack ? "🎯 On track to hit goal" : `${monthlyGoal - activeCasesEstimate} cases away from goal`} · ${activeIncome.toLocaleString()}/mo potential
                </p>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <label className="fl" style={{margin:0}}>Goal:</label>
                <input type="number" min="0" value={monthlyGoal} onChange={e=>saveMonthlyGoal(parseInt(e.target.value)||0)} 
                  style={{width:80,padding:"6px 8px",border:"1px solid var(--border)",fontFamily:"DM Mono,monospace",fontSize:12,textAlign:"center"}}/>
              </div>
            </div>
            <div style={{background:"var(--bg2)",height:10,borderRadius:5,overflow:"hidden"}}>
              <div style={{height:"100%",background:isOnTrack?"var(--green)":"var(--navy)",width:goalProgress+"%",transition:"width 0.3s"}}/>
            </div>
            <p style={{fontSize:10,color:"var(--text-dim)",marginTop:6,textAlign:"right"}}>{Math.round(goalProgress)}% to goal</p>
          </div>

          {/* KPI Row */}
          <div style={{display:"flex",gap:12,marginBottom:20,flexWrap:"wrap"}}>
            <div style={{flex:"1 1 140px",background:"var(--surface)",border:"1px solid var(--border)",padding:"14px 18px"}}>
              <p style={{fontSize:9,letterSpacing:"0.12em",color:"var(--text-dim)",textTransform:"uppercase",marginBottom:4}}>Total Pipeline</p>
              <p style={{fontFamily:"Cormorant Garamond,serif",fontSize:22,fontWeight:700,color:"var(--gold-dark)"}}>${totalPipelineValue.toLocaleString()}<span style={{fontSize:12,color:"var(--text-dim)"}}>/mo</span></p>
              <p style={{fontSize:10,color:"var(--text-dim)",marginTop:2}}>{totalCasesEstimate} cases est.</p>
            </div>
            <div style={{flex:"1 1 140px",background:"var(--surface)",border:"1px solid var(--border)",padding:"14px 18px"}}>
              <p style={{fontSize:9,letterSpacing:"0.12em",color:"var(--text-dim)",textTransform:"uppercase",marginBottom:4}}>Active Accounts</p>
              <p style={{fontFamily:"Cormorant Garamond,serif",fontSize:22,fontWeight:700,color:"var(--green)"}}>{activeAccounts.length}</p>
              <p style={{fontSize:10,color:"var(--text-dim)",marginTop:2}}>Stages 4–8</p>
            </div>
            <div style={{flex:"1 1 140px",background:"var(--surface)",border:"1px solid var(--border)",padding:"14px 18px"}}>
              <p style={{fontSize:9,letterSpacing:"0.12em",color:"var(--text-dim)",textTransform:"uppercase",marginBottom:4}}>Activities</p>
              <p style={{fontFamily:"Cormorant Garamond,serif",fontSize:22,fontWeight:700,color:"var(--navy)"}}>{thisMonthActivities.length}</p>
              <p style={{fontSize:10,color:"var(--text-dim)",marginTop:2}}>this month</p>
            </div>
            <div style={{flex:"1 1 140px",background:"var(--surface)",border:"1px solid var(--border)",padding:"14px 18px"}}>
              <p style={{fontSize:9,letterSpacing:"0.12em",color:"var(--text-dim)",textTransform:"uppercase",marginBottom:4}}>Orders Logged</p>
              <p style={{fontFamily:"Cormorant Garamond,serif",fontSize:22,fontWeight:700,color:"var(--gold-dark)"}}>{ordersThisMonth.length}</p>
              <p style={{fontSize:10,color:"var(--text-dim)",marginTop:2}}>this month</p>
            </div>
          </div>

          {/* Follow-ups due */}
          {followUpsDue.length > 0 && (
            <div style={{background:"var(--warn-bg)",border:"1px solid var(--warn)",borderLeft:"4px solid var(--warn)",padding:"14px 18px",marginBottom:20}}>
              <p style={{fontSize:9,letterSpacing:"0.12em",color:"var(--gold-dark)",textTransform:"uppercase",marginBottom:8,fontWeight:600}}>📅 {followUpsDue.length} Follow-up{followUpsDue.length===1?"":"s"} Due</p>
              {followUpsDue.slice(0,5).map(f => (
                <div key={f.id} onClick={()=>{const rec=records.find(r=>r.id===f.id);if(rec){setForm(rec);setView("edit");}}} 
                  style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderTop:"1px solid rgba(168,137,63,0.2)",cursor:"pointer"}}>
                  <div>
                    <p style={{fontFamily:"Cormorant Garamond,serif",fontSize:15,fontWeight:600}}>{f.name}</p>
                    {f.note && <p style={{fontSize:10,color:"var(--text-dim)",marginTop:2}}>{f.note.slice(0,80)}{f.note.length>80?"...":""}</p>}
                  </div>
                  <span style={{fontFamily:"DM Mono,monospace",fontSize:11,color:"var(--gold-dark)",fontWeight:600,whiteSpace:"nowrap",marginLeft:10}}>{f.date}</span>
                </div>
              ))}
              {followUpsDue.length > 5 && <p style={{fontSize:10,color:"var(--text-dim)",marginTop:8,fontStyle:"italic"}}>+ {followUpsDue.length - 5} more</p>}
            </div>
          )}

          {/* Pipeline Funnel */}
          <p style={{fontSize:9,letterSpacing:"0.14em",color:"var(--text-dim)",textTransform:"uppercase",marginBottom:10}}>Pipeline Funnel</p>
          <div style={{background:"var(--surface)",border:"1px solid var(--border)",padding:"16px 20px",marginBottom:20}}>
            {stageData.map(s => (
              <div key={s.id} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4,gap:8}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,flex:1,minWidth:0}}>
                    <div style={{width:10,height:10,background:s.color,borderRadius:"50%",flexShrink:0}}/>
                    <span style={{fontFamily:"DM Mono,monospace",fontSize:10,letterSpacing:"0.08em",textTransform:"uppercase",color:"var(--text-mid)"}}>{s.name}</span>
                  </div>
                  <div style={{display:"flex",gap:14,fontSize:11,color:"var(--text-dim)",fontFamily:"DM Mono,monospace",flexShrink:0}}>
                    <span><b style={{color:"var(--text)"}}>{s.count}</b> records</span>
                    {s.cases > 0 && <span><b style={{color:"var(--gold-dark)"}}>{s.cases}</b> cs/mo</span>}
                  </div>
                </div>
                <div style={{background:"var(--bg2)",height:6,borderRadius:3,overflow:"hidden"}}>
                  <div style={{height:"100%",background:s.color,width:((s.count/maxStageCount)*100)+"%",transition:"width 0.3s"}}/>
                </div>
              </div>
            ))}
          </div>

          {/* Two-column layout for Top Opps and Recent Activity */}
          <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
            {/* Top Opportunities */}
            <div style={{flex:"1 1 300px"}}>
              <p style={{fontSize:9,letterSpacing:"0.14em",color:"var(--text-dim)",textTransform:"uppercase",marginBottom:10}}>Top Opportunities</p>
              <div style={{background:"var(--surface)",border:"1px solid var(--border)",padding:"16px 20px"}}>
                {topOpps.length === 0 && <p style={{fontSize:11,color:"var(--text-dim)",fontStyle:"italic"}}>No accounts with cases/mo estimates yet. Add estimates to pending accounts to see opportunities.</p>}
                {topOpps.map((r,i) => (
                  <div key={r.id} onClick={()=>{setForm(r);setView("edit");}} style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderTop:i>0?"1px solid var(--border)":"none",cursor:"pointer"}}>
                    <div style={{flex:1,minWidth:0}}>
                      <p style={{fontFamily:"Cormorant Garamond,serif",fontSize:15,fontWeight:600}}>{r.name}</p>
                      <p style={{fontSize:10,color:"var(--text-dim)",marginTop:2}}>{stageName(r.stage)} · {r.type}</p>
                    </div>
                    <div style={{textAlign:"right",flexShrink:0,marginLeft:10}}>
                      <p style={{fontFamily:"DM Mono,monospace",fontSize:13,fontWeight:600,color:"var(--gold-dark)"}}>{r.casesPerMonth} cs/mo</p>
                      <p style={{fontSize:10,color:"var(--text-dim)"}}>${(r.casesPerMonth*COMMISSION_PER_CASE).toLocaleString()}/mo</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Recent Activity */}
            <div style={{flex:"1 1 300px"}}>
              <p style={{fontSize:9,letterSpacing:"0.14em",color:"var(--text-dim)",textTransform:"uppercase",marginBottom:10}}>Recent Activity</p>
              <div style={{background:"var(--surface)",border:"1px solid var(--border)",padding:"16px 20px"}}>
                {recentActivity.length === 0 && <p style={{fontSize:11,color:"var(--text-dim)",fontStyle:"italic"}}>No activity logged yet.</p>}
                {recentActivity.map((a,i) => (
                  <div key={i} onClick={()=>{const rec=records.find(r=>r.id===a.recordId);if(rec){setForm(rec);setView("edit");}}} 
                    style={{padding:"10px 0",borderTop:i>0?"1px solid var(--border)":"none",cursor:"pointer"}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                      <p style={{fontFamily:"Cormorant Garamond,serif",fontSize:14,fontWeight:600}}>{a.recordName}</p>
                      <span style={{fontSize:10,color:"var(--text-dim)",fontFamily:"DM Mono,monospace"}}>{a.date}</span>
                    </div>
                    <p style={{fontSize:10,color:"var(--navy)",letterSpacing:"0.06em",textTransform:"uppercase",fontWeight:600,marginBottom:3}}>{a.type}</p>
                    <p style={{fontSize:11,color:"var(--text-mid)",lineHeight:1.4}}>{a.note}</p>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </>);
      })()}
      {tab==="reports" && <p style={{padding:40,textAlign:"center",color:"var(--text-dim)"}}>Reports coming in Pass 4 — charts, breakdowns</p>}
    </div>

    {showSettings && <div style={{position:"fixed",inset:0,background:"rgba(10,36,71,0.6)",zIndex:10000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={()=>setShowSettings(false)}>
      <div style={{background:"var(--surface)",maxWidth:520,width:"100%",padding:24,border:"1px solid var(--border)"}} onClick={e=>e.stopPropagation()}>
        <p style={{fontFamily:"Cormorant Garamond,serif",fontSize:24,fontWeight:700,color:"var(--navy)",marginBottom:6}}>Cloud Sync</p>
        <div style={{marginBottom:18}}><label className="fl">Apps Script URL</label><input className="fi" value={syncUrl} onChange={e=>saveSyncUrl(e.target.value)}/></div>
        <div style={{marginBottom:18,padding:"12px 14px",background:"var(--navy-light)",border:"1px solid var(--border)"}}><label style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer",fontSize:11}}><input type="checkbox" checked={autoSync} onChange={toggleAutoSync}/><span><b>Auto-sync</b></span></label></div>
        <div style={{display:"flex",gap:8}}><button className="btn-primary" onClick={()=>cloudPush(false)}>Push</button><button className="btn-primary" style={{background:"var(--gold-dark)"}} onClick={()=>cloudPull(true)}>Pull</button><button className="btn-secondary" onClick={()=>setShowSettings(false)}>Close</button></div>
        {syncStatus && <p style={{fontSize:11,color:"var(--navy)",marginTop:12}}>{syncStatus}</p>}
      </div>
    </div>}

    {syncStatus && !showSettings && <div style={{position:"fixed",bottom:60,right:20,background:"var(--navy)",color:"#fff",padding:"10px 16px",fontFamily:"DM Mono,monospace",fontSize:11,zIndex:9999}}>{syncStatus}</div>}
    <div className={"save-toast"+(saveToast?" show":"")}>&#10003; SAVED</div>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<DiosAzulCRM/>);
</script>
</body>
</html>
